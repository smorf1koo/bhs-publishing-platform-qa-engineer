<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><title>Садовник теней — демо</title>
<style>html,body{margin:0;height:100%;background:#111;color:#eee;font:16px system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}#t{position:absolute;left:12px;top:8px}</style></head>
<body><div id="t">Демо «Садовник теней» — заглушка вместо web-сборки Godot</div>
<canvas id="c"></canvas>
<script>
const c=document.getElementById("c"),x=c.getContext("2d");let a=0;
function f(){c.width=c.clientWidth;c.height=c.clientHeight;x.fillStyle="#4b6b4f";
x.beginPath();x.arc(c.width/2+Math.cos(a)*80,c.height/2+Math.sin(a)*80,24,0,7);x.fill();a+=0.03;requestAnimationFrame(f)}f();
</script></body></html>
